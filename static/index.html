    /* better-interface audit fixes */
    :root{--faint:#84918b}
    html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .greeting h1{text-wrap:balance}
    .site-tile{color:inherit;text-decoration:none}

    body[data-theme="mint"]{--bg:#070a0d;--raised:#0c1115;--float:#11181d;--text:#f3f7f5;--soft:#a9b5b0;--faint:#84918b;--line:rgba(229,255,246,.12);--line2:rgba(229,255,246,.22);--mint:#62e6b7;--mint-d:#173f34;--danger:#ff7b89;--surface:rgba(12,17,21,.7);--search:rgba(9,13,16,.88);--tile:rgba(12,17,21,.42);--input:#080c0f;--primary-ink:#062219}
    body[data-theme="ocean"]{--bg:#07111d;--raised:#0b1826;--float:#112438;--text:#f2f7fb;--soft:#afbfcc;--faint:#8499aa;--line:rgba(220,240,255,.13);--line2:rgba(220,240,255,.24);--mint:#66bfff;--mint-d:#123b59;--danger:#ff8290;--surface:rgba(11,24,38,.76);--search:rgba(7,19,31,.9);--tile:rgba(12,29,45,.5);--input:#07131f;--primary-ink:#061b2b}

    body[data-theme="morning"]{--bg:#f3f1ea;--raised:#fffdf8;--float:#e9ece5;--text:#18211d;--soft:#4d5b54;--faint:#63736b;--line:rgba(25,50,38,.14);--line2:rgba(25,50,38,.26);--mint:#157a58;--mint-d:#d4e9df;--danger:#b9384a;--surface:rgba(255,253,248,.78);--search:rgba(255,253,248,.92);--tile:rgba(255,253,248,.58);--input:#faf9f4;--primary-ink:#f6fff9}

    body[data-theme] .quiet,body[data-theme] .round,body[data-theme] .tab,body[data-theme] .wallpaper{background:var(--surface)}
    body[data-theme] .quiet:hover,body[data-theme] .round:hover,body[data-theme] .tab:hover{background:var(--float)}
    body[data-theme] .searchbox{background:var(--search)}
    body[data-theme] .site-tile{background:var(--tile)}

    .themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.theme-choice{min-width:0;padding:7px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--soft)}.theme-choice.active{border-color:var(--mint);color:var(--text)}.theme-swatch{display:block;aspect-ratio:1.25;border-radius:7px;margin-bottom:7px;background:linear-gradient(135deg,var(--swatch-bg) 0 68%,var(--swatch-accent) 68%)}.theme-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}

<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark">N</div><div class="brand-copy"><strong>NOVA</strong><span>PERSONAL ORBIT</span></div></div><div class="top-actions"><div class="status"><span class="status-dot"></span><span>数据已保存在本机</span></div><button class="quiet" id="customize"><span class="quiet-label">个性化</span> ·</button><button class="round avatar" id="profile" aria-label="账户">游</button></div></header>
    <section class="hero" aria-labelledby="hello"><div class="clock" aria-label="当前时间"><span id="hour">09</span><i>:</i><span id="minute">41</span></div><div class="greeting"><p class="eyebrow">NOW · <span id="period">MORNING</span></p><h1 id="hello">早上好，准备从哪里开始？</h1><p class="date" id="date">8月14日 星期五</p></div></section>
    <form class="search-rail" id="searchForm" role="search"><span class="rail-node" aria-hidden="true"></span><div class="searchbox"><details class="engine" id="engine"><summary class="engine-summary"><span class="engine-badge" id="engineBadge">百</span><span class="engine-name" id="engineName">百度</span><span class="chev">⌄</span></summary><div class="engine-menu" id="engineMenu"></div></details><input id="query" autocomplete="off" aria-label="搜索内容或输入网址" placeholder="搜索，或直接输入网址"><kbd class="key">Ctrl K</kbd><button class="search-go" aria-label="开始搜索">→</button></div></form>
    <section class="workspace" aria-labelledby="trackTitle"><div class="section-head"><div class="section-title"><h2 id="trackTitle">你的轨道</h2><p><span id="siteCount">0</span> 个停靠点 · 自定义内容自动保存</p></div><div class="section-actions"><button class="quiet" id="addCategory">新建分类</button><button class="primary" id="addSite">＋ 添加网站</button></div></div><nav class="tabs" id="tabs" aria-label="网站分类"></nav><div class="site-grid" id="siteGrid"></div></section>
  </main>
  <dialog id="siteDialog"><form class="modal" id="siteForm"><div class="modal-head"><div><p class="eyebrow">NEW STOP</p><h2>添加网站</h2></div><button type="button" class="round" data-close="siteDialog" aria-label="关闭">×</button></div><div class="form-grid"><div class="field"><label for="siteName">网站名称</label><input id="siteName" required maxlength="20" placeholder="例如：少数派"></div><div class="field"><label for="siteUrl">网址</label><input id="siteUrl" required inputmode="url" placeholder="https://sspai.com"></div><div class="field"><label for="siteCategory">所属分类</label><select id="siteCategory"></select></div><div class="field"><label for="siteColor">标识颜色</label><input id="siteColor" type="color" value="#62e6b7"></div></div><div class="modal-actions"><button type="button" class="quiet" data-close="siteDialog">取消</button><button class="primary">添加到轨道</button></div></form></dialog>
  <dialog id="categoryDialog"><form class="modal" id="categoryForm"><div class="modal-head"><div><p class="eyebrow">NEW ORBIT</p><h2>新建分类</h2></div><button type="button" class="round" data-close="categoryDialog" aria-label="关闭">×</button></div><div class="field"><label for="categoryName">分类名称</label><input id="categoryName" required maxlength="10" placeholder="例如：灵感"></div><div class="modal-actions"><button type="button" class="quiet" data-close="categoryDialog">取消</button><button class="primary">创建分类</button></div></form></dialog>
  <dialog id="settingsDialog" class="drawer"><div class="modal"><div class="modal-head"><div><p class="eyebrow">CONTROL</p><h2>个性化</h2></div><button class="round" data-close="settingsDialog" aria-label="关闭">×</button></div><div class="setting-group"><h3>账户与同步</h3><div class="profile-row"><div class="avatar">游</div><div class="profile-copy"><strong id="profileTitle">访客模式</strong><span id="profileHint">自定义内容仅保存在当前浏览器</span></div><button class="quiet" id="login">登录</button></div></div><div class="setting-group"><h3>壁纸氛围</h3><div class="wallpapers" id="wallpapers"></div></div><div class="setting-group"><h3>界面</h3><div class="setting-row"><span>显示秒数<small>在时间旁显示秒钟</small></span><button class="switch" role="switch" data-setting="seconds" aria-checked="false" aria-label="显示秒数"></button></div><div class="setting-row"><span>显示问候<small>根据时间更新首页问候</small></span><button class="switch" role="switch" data-setting="greeting" aria-checked="true" aria-label="显示问候"></button></div></div><div class="setting-group"><button class="quiet danger" id="reset">恢复默认内容</button></div></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const KEY='nova-static-v1';
    const defaults={engine:'百度',active:'全部',loggedIn:false,wall:0,settings:{seconds:false,greeting:true},categories:['常用','工作','创作','生活'],sites:[{id:1,name:'哔哩哔哩',url:'https://bilibili.com',category:'常用',color:'#69c9d0',icon:'B'},{id:2,name:'GitHub',url:'https://github.com',category:'工作',color:'#d8dee9',icon:'G'},{id:3,name:'Notion',url:'https://notion.so',category:'工作',color:'#f0f0f0',icon:'N'},{id:4,name:'Figma',url:'https://figma.com',category:'创作',color:'#a983ff',icon:'F'},{id:5,name:'少数派',url:'https://sspai.com',category:'创作',color:'#ff5964',icon:'少'},{id:6,name:'知乎',url:'https://zhihu.com',category:'常用',color:'#5d9eff',icon:'知'},{id:7,name:'豆瓣',url:'https://douban.com',category:'生活',color:'#6cbd76',icon:'豆'}]};
    let state=Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'));state.settings=Object.assign({},defaults.settings,state.settings);
    const engines={'百度':['百','https://www.baidu.com/s?wd='],'Bing':['B','https://www.bing.com/search?q='],'Google':['G','https://www.google.com/search?q='],'DuckDuckGo':['D','https://duckduckgo.com/?q=']};
    const walls=[['静谧','radial-gradient(circle at 78% 18%,rgba(98,230,183,.11),transparent 29%),radial-gradient(circle at 15% 82%,rgba(57,104,147,.12),transparent 31%)'],['深海','radial-gradient(circle at 70% 20%,rgba(42,112,170,.23),transparent 35%),radial-gradient(circle at 20% 80%,rgba(32,76,101,.22),transparent 34%)'],['余晖','radial-gradient(circle at 78% 24%,rgba(209,104,66,.18),transparent 34%),radial-gradient(circle at 18% 78%,rgba(110,52,90,.18),transparent 35%)'],['纯黑','linear-gradient(#070a0d,#070a0d)']];
    const themes=[['mint','夜航薄荷','#070a0d','#62e6b7'],['ocean','深海蓝调','#07111d','#66bfff'],['amber','暖夜琥珀','#110d09','#f1b45e'],['morning','晨雾浅色','#f3f1ea','#157a58'],['editorial','黑白编辑部','#090909','#ff5a5f']];
    const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    function domain(url){try{return new URL(url.startsWith('http')?url:'https://'+url).hostname.replace('www.','')}catch{return url}}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    function renderEngine(){const e=engines[state.engine]||engines['百度'];$('#engineBadge').textContent=e[0];$('#engineName').textContent=state.engine}
    function render(){const cats=['全部',...state.categories];$('#tabs').innerHTML=cats.map(c=>`<button class="tab ${state.active===c?'active':''}" data-cat="${c}" aria-pressed="${state.active===c}">${c}</button>`).join('');const sites=state.active==='全部'?state.sites:state.sites.filter(s=>s.category===state.active);$('#siteCount').textContent=state.sites.length;$('#siteGrid').innerHTML=sites.length?sites.map(s=>`<a class="site-tile" href="${s.url.startsWith('http')?s.url:'https://'+s.url}" target="_blank" rel="noopener" style="--site:${s.color}"><span class="tile-head"><span class="site-icon">${s.icon||s.name[0]}</span><button class="delete" data-delete="${s.id}" aria-label="删除 ${s.name}">×</button></span><span class="site-name">${s.name}</span><span class="site-domain">${domain(s.url)}</span></a>`).join(''):'<div class="empty">这条轨道还没有停靠点。点击“添加网站”开始。</div>';document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.active=b.dataset.cat;save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const item=state.sites.find(s=>s.id==b.dataset.delete);if(confirm(`删除“${item.name}”？`)){state.sites=state.sites.filter(s=>s.id!=b.dataset.delete);save();render();toast('网站已删除')}});$('#siteCategory').innerHTML=state.categories.map(c=>`<option>${c}</option>`).join('');renderSettings()}
    function render(){const cats=['全部',...state.categories];$('#tabs').innerHTML=cats.map(c=>`<button class="tab ${state.active===c?'active':''}" data-cat="${c}" aria-pressed="${state.active===c}">${c}</button>`).join('');const sites=state.active==='全部'?state.sites:state.sites.filter(s=>s.category===state.active);$('#siteCount').textContent=state.sites.length;$('#siteGrid').innerHTML=sites.length?sites.map(s=>`<article class="site-tile-card" style="--site:${s.color}"><a class="site-tile" href="${s.url.startsWith('http')?s.url:'https://'+s.url}" target="_blank" rel="noopener" title="打开 ${s.name}"><span class="tile-head"><span class="site-icon">${s.icon||s.name[0]}</span></span><span class="site-name">${s.name}</span><span class="site-domain">${domain(s.url)}</span></a><button class="delete" data-delete="${s.id}" aria-label="删除 ${s.name}">×</button></article>`).join(''):'<div class="empty">这条轨道还没有停靠点。选择“添加网站”开始。</div>';document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.active=b.dataset.cat;save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const item=state.sites.find(s=>s.id==b.dataset.delete);if(confirm(`删除“${item.name}”？`)){state.sites=state.sites.filter(s=>s.id!=b.dataset.delete);save();render();toast('网站已删除')}});$('#siteCategory').innerHTML=state.categories.map(c=>`<option>${c}</option>`).join('');renderSettings()}
    function renderSettings(){document.querySelectorAll('.switch').forEach(s=>s.setAttribute('aria-checked',String(!!state.settings[s.dataset.setting])));$('#profileTitle').textContent=state.loggedIn?'NOVA 用户':'访客模式';$('#profileHint').textContent=state.loggedIn?'自定义内容已开启同步演示':'自定义内容仅保存在当前浏览器';$('#login').textContent=state.loggedIn?'退出':'登录';document.body.style.setProperty('--wall',walls[state.wall][1]);$('#wallpapers').innerHTML=walls.map((w,i)=>`<button class="wallpaper ${state.wall===i?'active':''}" style="--preview:${w[1]}" data-wall="${i}" aria-label="使用${w[0]}壁纸" aria-pressed="${state.wall===i}"></button>`).join('');document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{state.wall=+b.dataset.wall;save();renderSettings()})}
    function updateTime(){const now=new Date(),h=now.getHours(),sec=state.settings.seconds?`:${String(now.getSeconds()).padStart(2,'0')}`:'';$('#hour').textContent=String(h).padStart(2,'0');$('#minute').textContent=String(now.getMinutes()).padStart(2,'0')+sec;const period=h<6?'NIGHT':h<12?'MORNING':h<18?'AFTERNOON':'EVENING';$('#period').textContent=period;$('#hello').textContent=h<6?'夜深了，快速找到你需要的。':h<12?'早上好，准备从哪里开始？':h<18?'下午好，继续今天的探索。':'晚上好，收束一天的轨迹。';$('.greeting').hidden=!state.settings.greeting;$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(now)}
    const wallpaperGroup=$('#wallpapers').closest('.setting-group');wallpaperGroup.insertAdjacentHTML('beforebegin','<div class="setting-group"><h3>配色主题</h3><div class="themes" id="themes"></div></div>');
    const renderSettingsBase=renderSettings;renderSettings=function(){renderSettingsBase();state.theme=state.theme||'mint';document.body.dataset.theme=state.theme;document.documentElement.style.colorScheme=state.theme==='morning'?'light':'dark';$('#themes').innerHTML=themes.map(t=>`<button class="theme-choice ${state.theme===t[0]?'active':''}" data-theme="${t[0]}" aria-pressed="${state.theme===t[0]}"><span class="theme-swatch" style="--swatch-bg:${t[2]};--swatch-accent:${t[3]}"></span><span class="theme-name">${t[1]}</span></button>`).join('');document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();renderSettings();toast(`已切换为${themes.find(t=>t[0]===state.theme)[1]}`)})};
    $('#engineMenu').innerHTML=Object.keys(engines).map(e=>`<button type="button" class="engine-option" data-engine="${e}">${engines[e][0]}　${e}</button>`).join('');document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>{state.engine=b.dataset.engine;save();renderEngine();$('#engine').open=false});
    $('#searchForm').onsubmit=e=>{e.preventDefault();const q=$('#query').value.trim();if(!q)return;const direct=/^(https?:\/\/|[\w-]+\.[a-z]{2,})/i.test(q);open(direct?(q.startsWith('http')?q:'https://'+q):engines[state.engine][1]+encodeURIComponent(q),'_blank','noopener')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#query').focus()}});
    $('#addSite').onclick=()=>$('#siteDialog').showModal();$('#addCategory').onclick=()=>$('#categoryDialog').showModal();$('#customize').onclick=()=>$('#settingsDialog').showModal();$('#profile').onclick=()=>$('#settingsDialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
    $('#siteForm').onsubmit=e=>{e.preventDefault();const name=$('#siteName').value.trim(),url=$('#siteUrl').value.trim();state.sites.push({id:Date.now(),name,url,category:$('#siteCategory').value,color:$('#siteColor').value,icon:name[0].toUpperCase()});save();e.target.reset();$('#siteDialog').close();render();toast('网站已添加')};$('#categoryForm').onsubmit=e=>{e.preventDefault();const name=$('#categoryName').value.trim();if(!state.categories.includes(name))state.categories.push(name);state.active=name;save();e.target.reset();$('#categoryDialog').close();render();toast('分类已创建')};document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>{state.settings[b.dataset.setting]=!state.settings[b.dataset.setting];save();renderSettings();updateTime()});$('#login').onclick=()=>{state.loggedIn=!state.loggedIn;save();renderSettings();toast(state.loggedIn?'已进入同步演示':'已退出登录')};$('#reset').onclick=()=>{if(confirm('恢复默认网站和个性化设置？')){state=structuredClone(defaults);save();render();renderEngine();toast('已恢复默认内容')}};
    renderEngine();render();updateTime();setInterval(updateTime,1000);
  </script>
</body>
</html>
